<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global News Network</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="container">

        <div class="header">

            <img
                src="/static/logo.png"
                class="logo"
                alt="Logo"
            >

            <h1>

                Global News Network

            </h1>

            <p>

                Real-time worldwide news powered by Telegram.

            </p>

        </div>

        <div class="cards">

            <div class="card">

                🌍

                <h2>World News</h2>

                <p>

                    Latest headlines from around the world.

                </p>

            </div>

            <div class="card">

                ⚽

                <h2>Sports</h2>

                <p>

                    Football, NBA, Tennis and more.

                </p>

            </div>

            <div class="card">

                🚨

                <h2>Breaking</h2>

                <p>

                    Instant breaking news updates.

                </p>

            </div>

        </div>

        <button
            id="joinBtn"
        >

            Join Our Channels

        </button>

    </div>

    <script src="/static/app.js"></script>

</body>

</html>
